name: Evidence Service CI

on:
  pull_request:
    branches: [main, production]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint → Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          ruff check app/ scripts/ tests/
          ruff format --check app/ scripts/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATA_DIR: /tmp/test-evidence-runs
          SERPAPI_API_KEY: test-key-ci

  docker-build:
    name: Docker build test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-visibility-evidence-service:ci-test .
