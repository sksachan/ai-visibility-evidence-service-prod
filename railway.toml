[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["app/**", "scripts/**", "requirements.txt", "Dockerfile", "start.py", "start.sh"]

[deploy]
startCommand = "python start.py"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# IMPORTANT: Enable "Wait for CI" in Railway dashboard:
# Settings → Deploy → Check "Wait for CI to pass before deploying"
# This ensures GitHub Actions CI must pass before Railway deploys.
